<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Viewer</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>

<div class="header">
  <select id="fav-select" onchange="jumpToFavorite(this.value); this.value='';">
    <option value="">&#9733; Favorites</option>
  </select>
  <div class="header-controls">
    <button id="btn-refresh" onclick="refresh()">↻</button>
  </div>
</div>

<div class="tabs">
  <div class="tab" data-tab="files" onclick="switchTab('files')">ファイル</div>
  <div class="tab" data-tab="listen" onclick="switchTab('listen')">聴取</div>
</div>

<div class="content" id="content"></div>

<script>
const ROOT_DIR = {{ code_dir|tojson }};
const ROOT_NAME = {{ root_name|tojson }};
</script>
<script src="{{ asset('js/core.js') }}"></script>
<script src="{{ asset('js/files.js') }}"></script>
<script src="{{ asset('js/viewer.js') }}"></script>
<script src="{{ asset('js/bookmarks.js') }}"></script>
<script src="{{ asset('js/media.js') }}"></script>
<script src="{{ asset('js/listen.js') }}"></script>
<script src="{{ asset('js/notes.js') }}"></script>
<script src="{{ asset('js/app.js') }}"></script>

</body>
</html>
