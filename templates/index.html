<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Viewer</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
</head>
<body>

<div class="header">
  <select id="fav-select" onchange="jumpToFavorite(this.value); this.value='';">
    <option value="">&#9733; Favorites</option>
  </select>
  <div class="header-controls">
    <select id="repo-select"></select>
    <button id="btn-refresh" onclick="refresh()">↻</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="overview" onclick="switchTab('overview')">概要</div>
  <div class="tab" data-tab="log" onclick="switchTab('log')">ログ</div>
  <div class="tab" data-tab="diff" onclick="switchTab('diff')">差分</div>
  <div class="tab" data-tab="files" onclick="switchTab('files')">ファイル</div>
  <div class="tab" data-tab="listen" onclick="switchTab('listen')">聴取</div>
</div>

<div class="content" id="content"></div>

<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
<script>
const CODE_DIR = {{ code_dir|tojson }};
const ICON_FOLDER = `<svg width="14" height="12" viewBox="0 0 16 14" fill="none" style="vertical-align:-2px;"><path d="M1 2C1 1.45 1.45 1 2 1H6L8 3H14C14.55 3 15 3.45 15 4V12C15 12.55 14.55 13 14 13H2C1.45 13 1 12.55 1 12V2Z" fill="#e8a735" stroke="#c4891e" stroke-width=".5"/><path d="M1 5H15V12C15 12.55 14.55 13 14 13H2C1.45 13 1 12.55 1 12V5Z" fill="#f0c04a"/></svg>`;
const ICON_FOLDER_OPEN = `<svg width="14" height="12" viewBox="0 0 16 14" fill="none" style="vertical-align:-2px;"><path d="M1 2C1 1.45 1.45 1 2 1H6L8 3H14C14.55 3 15 3.45 15 4V5H3L0 12V2C0 1.45 .45 1 1 1Z" fill="#e8a735" stroke="#c4891e" stroke-width=".5"/><path d="M0 12L3 5H15L12 12H0Z" fill="#f0c04a" stroke="#c4891e" stroke-width=".5"/></svg>`;
const ICON_FILE = `<svg width="12" height="14" viewBox="0 0 12 14" fill="none" style="vertical-align:-2px;"><path d="M1 1H7L11 5V13H1V1Z" fill="#2d333b" stroke="#545d68" stroke-width=".7"/><path d="M7 1L11 5H7V1Z" fill="#3d444d"/><line x1="3" y1="7" x2="9" y2="7" stroke="#545d68" stroke-width=".5"/><line x1="3" y1="9" x2="9" y2="9" stroke="#545d68" stroke-width=".5"/><line x1="3" y1="11" x2="7" y2="11" stroke="#545d68" stroke-width=".5"/></svg>`;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const content = $('#content');
const repoSelect = $('#repo-select');
const favSelect = $('#fav-select');

let repos = [];
let currentRepo = '';
let currentTab = 'overview';
let logData = [];
let diffFormat = 'line-by-line';
let favorites = [];

// --- Change detection polling ---
let lastCheck = { head: '', changes: -1 };
let checkTimer = null;

function startChangePolling() {
  stopChangePolling();
  pollCheck();
  checkTimer = setInterval(pollCheck, 10000);
}
function stopChangePolling() {
  if (checkTimer) { clearInterval(checkTimer); checkTimer = null; }
}
async function pollCheck() {
  if (!currentRepo) return;
  try {
    const data = await fetchJson(`/api/check?repo=${currentRepo}`);
    if (lastCheck.head === '' && lastCheck.changes === -1) {
      lastCheck = { head: data.head, changes: data.changes };
      return;
    }
    if (data.head !== lastCheck.head || data.changes !== lastCheck.changes) {
      lastCheck = { head: data.head, changes: data.changes };
      showChangeBadge();
    }
  } catch {}
}
function showChangeBadge() {
  if (document.getElementById('change-badge')) return;
  const badge = document.createElement('span');
  badge.id = 'change-badge';
  badge.textContent = '更新あり';
  badge.className = 'change-badge';
  badge.onclick = () => { badge.remove(); renderTab(); };
  const header = document.querySelector('.header-controls') || document.querySelector('.header');
  if (header) header.appendChild(badge);
}
function resetChangeState() {
  lastCheck = { head: '', changes: -1 };
  const badge = document.getElementById('change-badge');
  if (badge) badge.remove();
}

// --- State persistence ---
const STATE_KEY = 'gitviewer_state';
function saveState() {
  localStorage.setItem(STATE_KEY, JSON.stringify({
    repo: currentRepo,
    tab: currentTab,
    path: currentPath,
  }));
}
function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || {}; } catch { return {}; }
}

// --- Init ---
function buildRepoOptions(repoList) {
  const uncategorized = repoList.filter(r => !r.category);
  const categories = {};
  for (const r of repoList) {
    if (r.category) {
      if (!categories[r.category]) categories[r.category] = [];
      categories[r.category].push(r);
    }
  }
  let html = uncategorized.map(r =>
    `<option value="${r.name}">${r.name}</option>`
  ).join('');
  for (const cat of Object.keys(categories).sort()) {
    html += `<optgroup label="${cat}">`;
    html += categories[cat].map(r =>
      `<option value="${r.name}">${r.name.split('/').pop()}</option>`
    ).join('');
    html += `</optgroup>`;
  }
  return html;
}

function buildFavOptions() {
  let html = '<option value="">&#9733; Favorites</option>';
  for (const fav of favorites) {
    let label = fav;
    for (const r of repos) {
      if (fav.startsWith(r.name + '/')) {
        const dirPath = fav.substring(r.name.length + 1);
        label = r.name + ' / ' + dirPath;
        break;
      }
      if (fav === r.name) {
        label = r.name;
        break;
      }
    }
    html += `<option value="${esc(fav)}">${esc(label)}</option>`;
  }
  favSelect.innerHTML = html;
}

async function toggleFavorite(event, repoName, dirPath) {
  event.stopPropagation();
  const favKey = repoName + '/' + dirPath;
  const isFav = favorites.includes(favKey);
  await fetch('/api/favorites', {
    method: isFav ? 'DELETE' : 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path: favKey}),
  });
  if (isFav) {
    favorites = favorites.filter(f => f !== favKey);
  } else {
    favorites.push(favKey);
  }
  buildFavOptions();
  renderFiles();
}

function jumpToFavorite(fav) {
  if (!fav) return;
  for (const r of repos) {
    if (fav.startsWith(r.name + '/') || fav === r.name) {
      const dirPath = fav.startsWith(r.name + '/') ? fav.substring(r.name.length + 1) : '';
      currentRepo = r.name;
      repoSelect.value = currentRepo;
      currentTab = 'files';
      $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'files'));
      renderFiles(dirPath);
      return;
    }
  }
}

async function init() {
  const saved = loadState();
  if (saved.tab && ['overview','log','diff','files','listen'].includes(saved.tab)) {
    currentTab = saved.tab;
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
  }
  if (saved.path) currentPath = saved.path;

  repoSelect.onchange = () => { currentRepo = repoSelect.value; currentPath = ''; saveState(); resetChangeState(); startChangePolling(); renderTab(); };

  // Kick off /api/repos in background (slow on Windows), render saved repo immediately.
  const reposPromise = fetchJson('/api/repos');
  const favsPromise = fetchJson('/api/favorites');
  const navDirsPromise = fetchJson('/api/nav_direction').catch(() => ({}));

  if (saved.repo) {
    currentRepo = saved.repo;
    startChangePolling();
    renderTab();
  }

  repos = await reposPromise;
  favorites = await favsPromise;
  navDirections = await navDirsPromise || {};
  repoSelect.innerHTML = buildRepoOptions(repos);
  buildFavOptions();

  const repoNames = repos.map(r => r.name);
  if (!currentRepo || !repoNames.includes(currentRepo)) {
    currentRepo = repos[0]?.name || '';
    if (currentRepo) {
      startChangePolling();
      renderTab();
    }
  }
  repoSelect.value = currentRepo;
}

async function refresh() {
  repos = await fetchJson('/api/repos');
  repoSelect.innerHTML = buildRepoOptions(repos);
  const repoNames = repos.map(r => r.name);
  if (!repoNames.includes(currentRepo) && repos.length > 0) {
    currentRepo = repos[0].name;
  }
  repoSelect.value = currentRepo;
  saveState();
  renderTab();
}

async function fetchJson(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

// --- Tabs ---
function switchTab(tab) {
  currentTab = tab;
  if (tab !== 'files') currentPath = '';
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  saveState();
  renderTab();
}

async function renderTab() {
  if (!currentRepo) { content.innerHTML = '<div class="diff-empty">リポジトリがありません</div>'; return; }
  clearBlobUi();
  if (currentTab === 'overview') await renderOverview();
  else if (currentTab === 'log') await renderLog();
  else if (currentTab === 'diff') await renderDiff();
  else if (currentTab === 'files') await renderFiles();
  else if (currentTab === 'listen') await renderListen();
}

// --- Listen (playback overview dashboard) ---
// 全 output.mp3 の再生ログ (.playback.jsonl) をサーバ側で集約し、どれをどこまで
// 聞いたかを横断一覧する。カバレッジ% (聴いた区間の合計) と到達% (最遠到達) を併記。
let listenItems = [];
let listenFilter = 'all';
let listenSort = 'name';

// 大フォルダー = プロジェクトフォルダの親 (projects 直下 / books / books/<series>)。
function listenGroupKey(it) { return it.dir.split('/').slice(0, -1).join('/'); }
function listenGroupLabel(key) { const seg = key.split('/'); return seg[seg.length - 1] || key; }

// グループの折り畳み状態は localStorage に保持 (再描画・再訪でも維持)。
function getListenCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem('gitviewer_listen_collapsed')) || []); }
  catch { return new Set(); }
}
function toggleListenGroup(key) {
  const c = getListenCollapsed();
  c.has(key) ? c.delete(key) : c.add(key);
  localStorage.setItem('gitviewer_listen_collapsed', JSON.stringify([...c]));
  renderListenView();
}

function fmtDur(sec) {
  if (!sec || !isFinite(sec) || sec <= 0) return '--:--';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function parseProjectName(name) {
  const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})_(.+)$/);
  if (!m) return { topic: name, when: '' };
  return { topic: m[6].replace(/_/g, ' '), when: `${m[2]}/${m[3]} ${m[4]}:${m[5]}` };
}

function listenCovPct(it) {
  if (!it.duration_sec) return null;
  return Math.min(100, Math.round(it.covered_sec / it.duration_sec * 100));
}
function listenReachPct(it) {
  if (!it.duration_sec) return null;
  return Math.min(100, Math.round(it.reach_sec / it.duration_sec * 100));
}
function listenStatus(it) {
  if (!it.sessions) return 'unlistened';
  const cov = listenCovPct(it);
  if (cov !== null && cov >= 90) return 'done';
  return 'progress';
}

async function renderListen() {
  content.innerHTML = '<div class="diff-empty">読み込み中…</div>';
  const items = await fetchJson(`/api/playback-overview?repo=${currentRepo}`);
  listenItems = Array.isArray(items) ? items : [];
  renderListenView();
}

function listenComparator(a, b) {
  switch (listenSort) {
    case 'played': return (b.last_played || '').localeCompare(a.last_played || '');
    case 'name': return a.name.localeCompare(b.name);
    case 'unlistenedFirst': {
      const ca = listenCovPct(a) ?? 0, cb = listenCovPct(b) ?? 0;
      if (ca !== cb) return ca - cb;
      return (b.mtime || 0) - (a.mtime || 0);
    }
    default: return (b.mtime || 0) - (a.mtime || 0);
  }
}

function listenRowHtml(it) {
  const { topic, when } = parseProjectName(it.name);
  const status = listenStatus(it);
  const cov = listenCovPct(it);
  const reach = listenReachPct(it);
  const statusIcon = { unlistened: '○', progress: '◐', done: '●' }[status];
  const covW = cov ?? 0;
  const marker = (reach !== null && reach > covW)
    ? `<span class="listen-reach-mark" style="left:${reach}%" title="到達 ${reach}%"></span>` : '';
  const last = it.last_played ? timeAgo(it.last_played) : '未再生';
  const pct = cov === null ? '再生記録あり'
    : `カバレッジ ${cov}%${reach !== null ? ` · 到達 ${reach}%` : ''}`;
  const meta = `${pct} · ${fmtDur(it.duration_sec)} · ${last}`;
  return `
    <div class="listen-row listen-${status} clickable" onclick="openAudioFromOverview('${esc(it.dir)}','${esc(it.audio)}')">
      <span class="listen-status listen-status-${status}">${statusIcon}</span>
      <div class="listen-main">
        <div class="listen-title">${esc(topic)}${when ? `<span class="listen-date">${when}</span>` : ''}</div>
        <div class="listen-metrics">
          <span class="listen-bar"><span class="listen-bar-cov" style="width:${covW}%"></span>${marker}</span>
          <span class="listen-meta">${meta}</span>
        </div>
      </div>
    </div>`;
}

function renderListenView() {
  if (listenItems.length === 0) {
    content.innerHTML = '<div class="diff-empty">このリポジトリに音声 (output.mp3) はありません</div>';
    return;
  }
  const counts = { all: listenItems.length, unlistened: 0, progress: 0, done: 0 };
  let totalCovered = 0;
  for (const it of listenItems) {
    counts[listenStatus(it)]++;
    totalCovered += it.covered_sec || 0;
  }
  const filtered = listenItems.filter(it => listenFilter === 'all' || listenStatus(it) === listenFilter);
  const groups = {};
  for (const it of filtered) (groups[listenGroupKey(it)] ||= []).push(it);
  const groupKeys = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  const collapsed = getListenCollapsed();
  const body = groupKeys.map(k => {
    const isCollapsed = collapsed.has(k);
    const header = `<div class="listen-group clickable" onclick="toggleListenGroup('${esc(k)}')">
      <span class="listen-caret">${isCollapsed ? '▶' : '▼'}</span>${esc(listenGroupLabel(k))}<span class="listen-group-n">${groups[k].length}</span></div>`;
    if (isCollapsed) return header;
    const rows = groups[k].slice().sort(listenComparator).map(listenRowHtml).join('');
    return `${header}<div class="list-box">${rows}</div>`;
  }).join('');

  const chip = (key, label) =>
    `<button class="listen-chip${listenFilter === key ? ' active' : ''}" onclick="setListenFilter('${key}')">${label}<span class="listen-chip-n">${counts[key]}</span></button>`;
  const opt = (key, label) => `<option value="${key}"${listenSort === key ? ' selected' : ''}>${label}</option>`;

  content.innerHTML = `
    <div class="listen-summary">全 ${counts.all} 本 · 未聴 ${counts.unlistened} · 途中 ${counts.progress} · 完聴 ${counts.done} · 合計聴取 ${fmtDur(totalCovered)}</div>
    <div class="listen-toolbar">
      <div class="listen-filters">
        ${chip('all', 'すべて')}${chip('unlistened', '未聴')}${chip('progress', '途中')}${chip('done', '完聴')}
      </div>
      <select class="listen-sort" onchange="setListenSort(this.value)">
        ${opt('name', '名前順')}${opt('recent', '新しい順')}${opt('played', '最終再生順')}${opt('unlistenedFirst', '未聴・低カバレッジ順')}
      </select>
    </div>
    ${body || '<div class="diff-empty">該当なし</div>'}`;
}

function setListenFilter(f) { listenFilter = f; renderListenView(); }
function setListenSort(s) { listenSort = s; renderListenView(); }

async function openAudioFromOverview(dir, audio) {
  currentTab = 'files';
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'files'));
  saveState();
  await renderFiles(dir);
  await showBlob(audio);
  const player = document.getElementById('audio-player');
  if (player) player.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- Overview ---
async function renderOverview() {
  const [logs, diffData, branchData, info] = await Promise.all([
    fetchJson(`/api/log?repo=${currentRepo}&limit=5`),
    fetchJson(`/api/diff?repo=${currentRepo}`),
    fetchJson(`/api/branches?repo=${currentRepo}`),
    fetchJson(`/api/info?repo=${currentRepo}`),
  ]);
  if (!info || !info.branch) return;
  const files = diffData.files || [];
  const branches = branchData || [];

  content.innerHTML = `
    <div class="status-bar">
      <span><span class="label">branch:</span> <span class="val-branch">${info.branch}</span></span>
      <span><span class="label">changes:</span> <span class="val-changes">${info.changes} files</span></span>
      <span><span class="label">latest:</span> <span class="val-time">${timeAgo(info.latest_time)}</span></span>
      <span><span class="label">remote:</span> <span class="val-remote">${info.remote_status}</span></span>
    </div>
    ${branches.length > 1 ? `
      <div class="section-header">branches</div>
      <div class="list-box">${branches.map(b => `
        <div class="list-row${b.current ? ' branch-current' : ''}">
          <span class="branch-icon">${b.current ? '●' : '○'}</span>
          <span class="branch-name">${esc(b.name)}</span>
          <span class="commit-hash">${b.hash}</span>
          ${b.upstream ? `<span class="commit-time">${esc(b.upstream)}</span>` : ''}
        </div>
      `).join('')}</div>
    ` : ''}
    ${files.length > 0 ? `
      <div class="section-header">changes</div>
      <div class="list-box">${files.map((f, i) => `
        <div class="list-row clickable" onclick="toggleFileDiff(this, '${esc(f)}', 'ov-diff-${i}')">
          <span class="badge-m">M</span><span>${esc(f)}</span>
        </div>
        <div class="diff-inline" id="ov-diff-${i}" style="display:none;"></div>
      `).join('')}</div>
    ` : ''}
    <div class="section-header">recent commits</div>
    <div class="list-box">${logs.map(c => `
      <div class="list-row">
        <span class="commit-hash">${c.hash}</span>
        <span class="commit-msg">${esc(c.message)}</span>
        <span class="commit-time">${timeAgo(c.time)}</span>
      </div>
    `).join('')}</div>
  `;
}

// --- Log ---
async function renderLog() {
  logData = await fetchJson(`/api/log?repo=${currentRepo}&limit=50`);

  content.innerHTML = `
    <div class="list-box">${logData.map((c, i) => `
      <div class="list-row clickable" onclick="toggleCommitDiff(this, '${c.hash}', ${i})">
        <span class="commit-hash">${c.hash}</span>
        <span class="commit-msg">${esc(c.message)}</span>
        <span class="commit-stat">${c.files_changed > 0 ? `${c.files_changed}f <span class="stat-add">+${c.insertions}</span> <span class="stat-del">-${c.deletions}</span>` : ''}</span>
        <span class="commit-time">${timeAgo(c.time)}</span>
      </div>
      <div class="diff-inline" id="diff-${i}" style="display:none;"></div>
    `).join('')}</div>
  `;
}

async function toggleCommitDiff(row, hash, idx) {
  const el = document.getElementById(`diff-${idx}`);
  if (el.style.display !== 'none') {
    el.style.display = 'none';
    return;
  }
  el.innerHTML = '<div style="padding:4px 8px;color:var(--text-muted);">Loading...</div>';
  el.style.display = 'block';

  const data = await fetchJson(`/api/diff?repo=${currentRepo}&commit=${hash}`);
  if (data.diff) {
    el.innerHTML = `<div class="diff-toolbar"><button class="diff-toggle" onclick="event.stopPropagation(); toggleDiffFormat(this, '${hash}', ${idx})">⇄ ${diffFormat === 'line-by-line' ? 'side-by-side' : 'line-by-line'}</button></div><div class="diff-container">${renderDiffHtml(data.diff)}</div>`;
  } else {
    el.innerHTML = '<div class="diff-empty">差分なし</div>';
  }
}

async function toggleDiffFormat(btn, hash, idx) {
  diffFormat = diffFormat === 'line-by-line' ? 'side-by-side' : 'line-by-line';
  const el = document.getElementById(`diff-${idx}`);
  const data = await fetchJson(`/api/diff?repo=${currentRepo}&commit=${hash}`);
  if (data.diff) {
    el.innerHTML = `<div class="diff-toolbar"><button class="diff-toggle" onclick="event.stopPropagation(); toggleDiffFormat(this, '${hash}', ${idx})">⇄ ${diffFormat === 'line-by-line' ? 'side-by-side' : 'line-by-line'}</button></div><div class="diff-container">${renderDiffHtml(data.diff)}</div>`;
  }
}

function toggleWorkingDiffFormat() {
  diffFormat = diffFormat === 'line-by-line' ? 'side-by-side' : 'line-by-line';
  renderDiff();
}

// --- Diff (working tree) ---
async function renderDiff() {
  const data = await fetchJson(`/api/diff?repo=${currentRepo}`);

  if (!data.diff) {
    content.innerHTML = '<div class="diff-empty">未コミットの変更はありません</div>';
    return;
  }

  content.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="section-header" style="margin:0;">uncommitted changes (${(data.files || []).length} files)</div>
      <button class="diff-toggle" onclick="toggleWorkingDiffFormat()">⇄ ${diffFormat === 'line-by-line' ? 'side-by-side' : 'line-by-line'}</button>
    </div>
    <div class="diff-container">${renderDiffHtml(data.diff)}</div>
  `;
}

// --- File diff toggle (overview changes) ---
async function toggleFileDiff(row, filePath, elId) {
  const el = document.getElementById(elId);
  if (el.style.display !== 'none') {
    el.style.display = 'none';
    return;
  }
  el.innerHTML = '<div style="padding:4px 8px;color:var(--text-muted);">Loading...</div>';
  el.style.display = 'block';

  const data = await fetchJson(`/api/diff?repo=${currentRepo}&file=${encodeURIComponent(filePath)}`);
  if (data.diff) {
    el.innerHTML = `<div class="diff-container">${renderDiffHtml(data.diff)}</div>`;
  } else {
    el.innerHTML = '<div class="diff-empty">差分なし</div>';
  }
}

// --- Files tab ---
let currentPath = '';

// --- File sort: per-directory + global default ---
const SORT_DEFAULT_KEY = 'gitviewer_tree_sort_default';
const SORT_BY_DIR_KEY = 'gitviewer_tree_sort_by_dir';
const SORT_KEY_LABELS = { name: 'Name', mtime: 'Modified', type: 'Type' };
const SORT_KEY_ORDER = ['name', 'mtime', 'type'];
const DEFAULT_SORT_CONFIG = { keys: [{ key: 'name', dir: 'asc' }], foldersFirst: true };

function _readSortDefault() {
  try {
    const v = JSON.parse(localStorage.getItem(SORT_DEFAULT_KEY) || 'null');
    if (v && Array.isArray(v.keys) && v.keys.length > 0) return v;
  } catch {}
  return JSON.parse(JSON.stringify(DEFAULT_SORT_CONFIG));
}
function _readSortByDir() {
  try { return JSON.parse(localStorage.getItem(SORT_BY_DIR_KEY) || '{}') || {}; } catch { return {}; }
}
function _writeSortByDir(map) {
  localStorage.setItem(SORT_BY_DIR_KEY, JSON.stringify(map));
}
function _sortDirKey(repo, dir) { return `${repo}|${dir}`; }

function getSortConfig(repo, dir) {
  const map = _readSortByDir();
  const k = _sortDirKey(repo, dir);
  if (map[k] && Array.isArray(map[k].keys) && map[k].keys.length > 0) return map[k];
  return _readSortDefault();
}
function isDirSortOverridden(repo, dir) {
  const map = _readSortByDir();
  return !!map[_sortDirKey(repo, dir)];
}
function saveSortConfigForDir(repo, dir, cfg) {
  const map = _readSortByDir();
  map[_sortDirKey(repo, dir)] = cfg;
  _writeSortByDir(map);
}
function clearSortConfigForDir(repo, dir) {
  const map = _readSortByDir();
  delete map[_sortDirKey(repo, dir)];
  _writeSortByDir(map);
}
function saveSortDefault(cfg) {
  localStorage.setItem(SORT_DEFAULT_KEY, JSON.stringify(cfg));
}

const _sortCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function _entryExt(e) {
  if (e.type === 'tree') return '';
  const dot = e.name.lastIndexOf('.');
  return dot > 0 ? e.name.substring(dot + 1).toLowerCase() : '';
}
function _compareByKey(a, b, key) {
  if (key === 'name') return _sortCollator.compare(a.name, b.name);
  if (key === 'mtime') {
    const ax = +a.mtime || 0, bx = +b.mtime || 0;
    return ax < bx ? -1 : ax > bx ? 1 : 0;
  }
  if (key === 'type') return _sortCollator.compare(_entryExt(a), _entryExt(b));
  return 0;
}
function sortEntries(entries, cfg) {
  const arr = entries.slice();
  const keys = (cfg.keys || []).filter(k => SORT_KEY_LABELS[k.key]);
  arr.sort((a, b) => {
    if (cfg.foldersFirst) {
      const ax = a.type === 'tree' ? 0 : 1;
      const bx = b.type === 'tree' ? 0 : 1;
      if (ax !== bx) return ax - bx;
    }
    for (const { key, dir } of keys) {
      const c = _compareByKey(a, b, key);
      if (c !== 0) return dir === 'desc' ? -c : c;
    }
    return _sortCollator.compare(a.name, b.name);
  });
  return arr;
}

// --- Sort popover UI ---
let _sortPopoverEditing = null; // working copy of cfg while popover is open

function toggleSortPopover(ev) {
  ev && ev.stopPropagation && ev.stopPropagation();
  const existing = document.getElementById('sort-popover');
  if (existing) { closeSortPopover(); return; }
  openSortPopover(ev && ev.currentTarget);
}

function openSortPopover(anchorEl) {
  _sortPopoverEditing = JSON.parse(JSON.stringify(getSortConfig(currentRepo, currentPath)));
  const pop = document.createElement('div');
  pop.id = 'sort-popover';
  pop.className = 'sort-popover';
  pop.onclick = e => e.stopPropagation();
  document.body.appendChild(pop);
  renderSortPopover();

  if (anchorEl) {
    const r = anchorEl.getBoundingClientRect();
    const top = window.scrollY + r.bottom + 4;
    pop.style.top = top + 'px';
    // Anchor right edge to button right edge, then clamp into viewport
    pop.style.left = '0px';
    const pw = pop.offsetWidth;
    let left = window.scrollX + r.right - pw;
    if (left < 8) left = 8;
    pop.style.left = left + 'px';
  }

  setTimeout(() => {
    document.addEventListener('click', _sortPopoverOutsideClick, true);
    document.addEventListener('keydown', _sortPopoverKeydown, true);
  }, 0);
}

function closeSortPopover() {
  const pop = document.getElementById('sort-popover');
  if (pop) pop.remove();
  _sortPopoverEditing = null;
  document.removeEventListener('click', _sortPopoverOutsideClick, true);
  document.removeEventListener('keydown', _sortPopoverKeydown, true);
}

function _sortPopoverOutsideClick(e) {
  const pop = document.getElementById('sort-popover');
  if (!pop) return;
  if (pop.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.sort-button')) return;
  closeSortPopover();
}
function _sortPopoverKeydown(e) {
  if (e.key === 'Escape') closeSortPopover();
}

function renderSortPopover() {
  const pop = document.getElementById('sort-popover');
  if (!pop || !_sortPopoverEditing) return;
  const cfg = _sortPopoverEditing;
  const used = new Set(cfg.keys.map(k => k.key));
  const unused = SORT_KEY_ORDER.filter(k => !used.has(k));
  const overridden = isDirSortOverridden(currentRepo, currentPath);

  const rows = cfg.keys.map((k, i) => `
    <div class="sort-priority-row">
      <span class="sort-priority-idx">${i + 1}.</span>
      <span class="sort-priority-label">${SORT_KEY_LABELS[k.key]}</span>
      <button class="sort-arrow${k.dir === 'asc' ? ' active' : ''}" onclick="setSortDir(${i}, 'asc')" title="昇順">↑</button>
      <button class="sort-arrow${k.dir === 'desc' ? ' active' : ''}" onclick="setSortDir(${i}, 'desc')" title="降順">↓</button>
      <button class="sort-move" onclick="moveSortKey(${i}, -1)" ${i === 0 ? 'disabled' : ''} title="上へ">▲</button>
      <button class="sort-move" onclick="moveSortKey(${i}, 1)" ${i === cfg.keys.length - 1 ? 'disabled' : ''} title="下へ">▼</button>
      <button class="sort-remove" onclick="removeSortKey(${i})" ${cfg.keys.length <= 1 ? 'disabled' : ''} title="削除">×</button>
    </div>
  `).join('');

  const addOptions = unused.length === 0
    ? `<span style="color:var(--text-muted);">（追加可能なキーなし）</span>`
    : `<select id="sort-add-select">${unused.map(k => `<option value="${k}">${SORT_KEY_LABELS[k]}</option>`).join('')}</select>
       <button class="sort-add-btn" onclick="addSortKey()">+ 追加</button>`;

  pop.innerHTML = `
    <div class="sort-popover-title">並び替え優先順位</div>
    <div class="sort-priority-list">${rows}</div>
    <div class="sort-add-row">${addOptions}</div>
    <label class="sort-folders-first">
      <input type="checkbox" ${cfg.foldersFirst ? 'checked' : ''} onchange="setFoldersFirst(this.checked)">
      フォルダを先頭に
    </label>
    <div class="sort-popover-actions">
      <button onclick="applySortToDir()" title="このディレクトリだけに適用">このフォルダのみ</button>
      <button onclick="applySortAsDefault()" title="全ディレクトリの既定値として保存">デフォルトに設定</button>
      <button onclick="resetSortForDir()" ${overridden ? '' : 'disabled'} title="このディレクトリの設定を削除してデフォルトに戻す">リセット</button>
      <button onclick="closeSortPopover()">閉じる</button>
    </div>
  `;
}

function _afterSortChange() {
  // Auto-save: while popover is open, any edit applies to current dir immediately.
  saveSortConfigForDir(currentRepo, currentPath, _sortPopoverEditing);
  renderSortPopover();
  rerenderFilesFromCache();
}

function setSortDir(idx, dir) {
  if (!_sortPopoverEditing) return;
  const k = _sortPopoverEditing.keys[idx];
  if (!k) return;
  k.dir = dir;
  _afterSortChange();
}
function moveSortKey(idx, delta) {
  if (!_sortPopoverEditing) return;
  const arr = _sortPopoverEditing.keys;
  const j = idx + delta;
  if (j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  _afterSortChange();
}
function removeSortKey(idx) {
  if (!_sortPopoverEditing) return;
  const arr = _sortPopoverEditing.keys;
  if (arr.length <= 1) return;
  arr.splice(idx, 1);
  _afterSortChange();
}
function addSortKey() {
  if (!_sortPopoverEditing) return;
  const sel = document.getElementById('sort-add-select');
  if (!sel || !sel.value) return;
  if (_sortPopoverEditing.keys.some(k => k.key === sel.value)) return;
  _sortPopoverEditing.keys.push({ key: sel.value, dir: 'asc' });
  _afterSortChange();
}
function setFoldersFirst(checked) {
  if (!_sortPopoverEditing) return;
  _sortPopoverEditing.foldersFirst = !!checked;
  _afterSortChange();
}
function applySortToDir() {
  if (!_sortPopoverEditing) return;
  saveSortConfigForDir(currentRepo, currentPath, _sortPopoverEditing);
  renderSortPopover();
  rerenderFilesFromCache();
}
function applySortAsDefault() {
  if (!_sortPopoverEditing) return;
  saveSortDefault(_sortPopoverEditing);
  clearSortConfigForDir(currentRepo, currentPath);
  renderSortPopover();
  rerenderFilesFromCache();
}
function resetSortForDir() {
  clearSortConfigForDir(currentRepo, currentPath);
  _sortPopoverEditing = JSON.parse(JSON.stringify(getSortConfig(currentRepo, currentPath)));
  renderSortPopover();
  rerenderFilesFromCache();
}

function renderFilesView(entries) {
  const breadcrumb = buildBreadcrumb(currentPath);

      }).join('')}

function formatMtime(mtime) {
  if (!mtime || !isFinite(mtime)) return '';
  const d = new Date(mtime * 1000);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const mm = pad(d.getMonth() + 1);
  const dd = pad(d.getDate());
  const hms = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (d.getFullYear() === now.getFullYear()) {
    return `${mm}/${dd} ${hms}`;
  }
  return `${pad(d.getFullYear() % 100)}/${mm}/${dd} ${hms}`;
}

function formatSortLabel(cfg) {
  const arrow = d => d === 'desc' ? '↓' : '↑';
  const parts = (cfg.keys || []).map(k => `${SORT_KEY_LABELS[k.key] || k.key} ${arrow(k.dir)}`);
  if (parts.length === 0) return 'Name ↑';
  return parts.join(' → ');
}

function rerenderFilesFromCache() {
  const key = `${currentRepo}|${currentPath}`;
  if (lastDirFetch.key === key && Array.isArray(lastDirFetch.entries)) {
    renderFilesView(lastDirFetch.entries);
  } else {
    renderFiles(currentPath);
  }
}

function buildBreadcrumb(path) {
  let html = `<span class="clickable" onclick="renderFiles('')" style="cursor:pointer;color:var(--accent);">${currentRepo}</span>`;
  if (path) {
    const parts = path.split('/');
    let acc = '';
    for (const p of parts) {
      acc = acc ? acc + '/' + p : p;
      html += ` / <span class="clickable" onclick="renderFiles('${acc}')" style="cursor:pointer;color:var(--accent);">${esc(p)}</span>`;
    }
  }
  return html;
}

function parentPath(path) {
  const i = path.lastIndexOf('/');
  return i > 0 ? path.substring(0, i) : '';
}

function resolveMdAssetUrl(url, baseDir) {
  if (!url) return url;
  if (/^(https?:)?\/\//i.test(url) || /^data:/i.test(url) || /^(mailto|tel|javascript):/i.test(url) || url.startsWith('#')) {
    return url;
  }
  const hashIdx = url.search(/[?#]/);
  const rawPath = hashIdx >= 0 ? url.slice(0, hashIdx) : url;
  let target = rawPath.startsWith('/') ? rawPath.slice(1) : (baseDir ? baseDir + '/' + rawPath : rawPath);
  const parts = [];
  for (const seg of target.split('/')) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg);
  }
  const normalized = parts.join('/');
  if (!normalized) return url;
  return `/api/blob?repo=${encodeURIComponent(currentRepo)}&path=${encodeURIComponent(normalized)}`;
}

function rewriteMdAssets(container, baseDir) {
  container.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src');
    if (src) img.setAttribute('src', resolveMdAssetUrl(src, baseDir));
  });
  container.querySelectorAll('source, video, audio').forEach(el => {
    const src = el.getAttribute('src');
    if (src) el.setAttribute('src', resolveMdAssetUrl(src, baseDir));
  });
}

const IMAGE_EXTS = ['jpg','jpeg','png','gif','svg','webp','ico','bmp','avif','heic','heif'];
const PDF_EXTS = ['pdf'];
const AUDIO_EXTS = ['mp3','wav','ogg','m4a','flac','aac','opus'];
const VIDEO_EXTS = ['mp4','webm','m4v','mov','ogv'];
const TEXT_EXTS = [
  'py','js','ts','jsx','tsx','sh','bash','ps1','psm1','psd1','json','yml','yaml',
  'xml','html','htm','css','toml','md','txt','cfg','ini','conf','env','service','timer',
  'csv','sql','rb','go','rs','java','c','h','cpp','hpp','vue','svelte','gitignore',
  'dockerignore','makefile','lock','log','srt',
];
const LANG_MAP = {
  '.py':'python', '.js':'javascript', '.ts':'typescript', '.jsx':'javascript',
  '.tsx':'typescript', '.sh':'bash', '.bash':'bash', '.json':'json',
  '.yml':'yaml', '.yaml':'yaml', '.xml':'xml', '.html':'html', '.css':'css',
  '.toml':'toml', '.rb':'ruby', '.go':'go', '.rs':'rust', '.java':'java',
  '.c':'c', '.h':'c', '.cpp':'cpp', '.hpp':'cpp', '.sql':'sql',
  '.vue':'html', '.svelte':'html',
  '.ps1':'powershell', '.psm1':'powershell', '.psd1':'powershell',
};

function parseSrt(text) {
  const cleaned = text.replace(/^﻿/, '').replace(/\r\n/g, '\n');
  const blocks = cleaned.split(/\n\s*\n+/);
  const timeRe = /(\d+:\d+:\d+[,.]\d+)\s*-->\s*(\d+:\d+:\d+[,.]\d+)/;
  const speakerRe = /^([^\s:：]{1,16})[:：]\s*/;
  const cues = [];
  for (const block of blocks) {
    const raw = block.split('\n');
    let s = 0, e = raw.length;
    while (s < e && raw[s].trim() === '') s++;
    while (e > s && raw[e - 1].trim() === '') e--;
    const lines = raw.slice(s, e);
    if (lines.length === 0) continue;

    let i = 0;
    let index = '';
    if (/^\d+$/.test(lines[i].trim())) {
      index = lines[i].trim();
      i++;
    }
    let start = '', end = '';
    if (i < lines.length) {
      const m = lines[i].match(timeRe);
      if (m) {
        start = m[1];
        end = m[2];
        i++;
      }
    }
    const textLines = lines.slice(i);
    if (textLines.length === 0 && !index && !start) continue;
    let body = textLines.join('\n');
    let speaker = '';
    const spk = body.match(speakerRe);
    if (spk) {
      speaker = spk[1];
      body = body.slice(spk[0].length);
    }
    cues.push({index, start, end, speaker, text: body});
  }
  return cues;
}

const SPEAKER_COLOR_OVERRIDES = {
  'ソウタ': 'hsl(210, 70%, 60%)',   // 青
  'リン': 'hsl(340, 70%, 62%)',     // ローズ (青と十分コントラスト)。kotoha→rin 交代でハッシュ色が青に近接した実害を固定色で回避 (2026-06-14)
};
function speakerColor(name) {
  if (!name) return '';
  if (SPEAKER_COLOR_OVERRIDES[name]) return SPEAKER_COLOR_OVERRIDES[name];
  // FNV-1a 32bit → golden-angle で hue を散らし、S/L にも上位ビットを混ぜて
  // `% 360` の近接コリジョン（例: コトハ/ソウタ）を回避する
  let h = 2166136261 >>> 0;
  for (let i = 0; i < name.length; i++) {
    h ^= name.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  const hue = (h * 137.508) % 360;
  const sat = 50 + ((h >>> 16) & 0x1f); // 50–81%
  const lig = 55 + ((h >>> 24) & 0x0f); // 55–70%
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${lig}%)`;
}

function timeToSeconds(tc) {
  if (!tc) return NaN;
  const m = tc.match(/^(\d+):(\d+):(\d+)[,.](\d+)$/);
  if (!m) return NaN;
  return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / Math.pow(10, m[4].length);
}

async function loadSiblingSrt(audioPath) {
  const slash = audioPath.lastIndexOf('/');
  const dir = slash >= 0 ? audioPath.slice(0, slash + 1) : '';
  const base = slash >= 0 ? audioPath.slice(slash + 1) : audioPath;
  const stem = base.replace(/\.[^./]+$/, '');
  const candidates = [dir + stem + '.srt', dir + base + '.srt'];
  for (const p of candidates) {
    const data = await fetchJson(
      `/api/blob?repo=${encodeURIComponent(currentRepo)}&path=${encodeURIComponent(p)}`
    );
    if (data && typeof data.content === 'string') return { path: p, text: data.content };
  }
  return null;
}

async function setupSrtEmbed(audioPath) {
  // Capture DOM refs *before* the await below: on rapid file-switch the late
  // resolution lands on the detached old #srt-embed and the write is GC'd.
  const container = document.getElementById('srt-embed');
  const audio = document.getElementById('audio-player');
  if (!container || !audio) return;

  const result = await loadSiblingSrt(audioPath);
  if (!result) return;

  const parsed = parseSrt(result.text);
  if (parsed.length === 0) {
    container.innerHTML = `<div class="srt-embed-empty">字幕を読み込めませんでした</div>`;
    return;
  }
  const cues = parsed.map(c => ({
    ...c,
    startSec: timeToSeconds(c.start),
    endSec: timeToSeconds(c.end),
  }));

  const cardsHtml = cues.map(c => {
    const color = speakerColor(c.speaker);
    const styleAttr = color ? ` style="--speaker-color: ${color};"` : '';
    const timeStr = (c.start && c.end) ? `${esc(c.start)} → ${esc(c.end)}` : '--';
    return `<div class="srt-cue" data-start="${c.startSec}" data-end="${c.endSec}"${styleAttr}>
      <div class="srt-meta"><span class="srt-time">${timeStr}</span></div>
      <div class="srt-text">${esc(c.text)}</div>
    </div>`;
  }).join('');

  container.innerHTML = cardsHtml;

  setupSrtSync(audio, container, cues);

  await fetchNotes(result.path);
  notesState.embedMode = true;
  notesState.embedCues = cues;
  decorateEmbeddedSrtNotes(container, cues);
}

// While a note modal is open, suppress SRT auto-scroll so the modal
// (and the user's textarea focus on mobile) doesn't get yanked around.
let activeNoteModals = 0;

function setupSrtSync(audio, container, cues) {
  const cueEls = container.querySelectorAll('.srt-cue');
  const isVideo = audio.tagName === 'VIDEO';
  let currentIdx = -1;
  let followEnabled = true;
  let programmaticScrollUntil = 0;
  let manualPauseTimer = null;

  // 字幕は入れ子スクロールをやめ .content 単一スクロールで流す。手動スクロール検知も
  // .content に張る (file 切替の度に重複登録しないよう、前回ハンドラを差し替える)。
  const scroller = document.querySelector('.content');

  const resumeFollow = () => {
    followEnabled = true;
    clearTimeout(manualPauseTimer);
    manualPauseTimer = null;
  };
  const pauseFromManualScroll = () => {
    followEnabled = false;
    clearTimeout(manualPauseTimer);
    manualPauseTimer = setTimeout(resumeFollow, 5000);
  };

  if (scroller) {
    if (scroller._srtFollowScrollHandler) {
      scroller.removeEventListener('scroll', scroller._srtFollowScrollHandler);
    }
    const onScroll = () => {
      if (performance.now() < programmaticScrollUntil) return;
      pauseFromManualScroll();
    };
    scroller._srtFollowScrollHandler = onScroll;
    scroller.addEventListener('scroll', onScroll, { passive: true });
  }

  const findIdx = (t) => {
    if (currentIdx >= 0 && currentIdx < cues.length) {
      const c = cues[currentIdx];
      if (t >= c.startSec && t <= c.endSec) return currentIdx;
    }
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].startSec && t <= cues[i].endSec) return i;
    }
    return -1;
  };

  const update = () => {
    const idx = findIdx(audio.currentTime);
    if (idx === currentIdx) return;
    if (currentIdx >= 0 && cueEls[currentIdx]) cueEls[currentIdx].classList.remove('current');
    currentIdx = idx;
    if (idx < 0) return;
    const el = cueEls[idx];
    if (!el) return;
    el.classList.add('current');
    if (followEnabled && !isVideo && activeNoteModals === 0 && scroller) {
      // 上部固定の章帯の下端より少し下に現在 cue が来るようスクロール (中央寄せだと
      // 背の高い章帯の裏に隠れるため)。章が無い (帯非表示) 時は navH=0 で素直に上寄せ。
      const navEl = document.getElementById('chapter-nav');
      const navH = navEl ? navEl.offsetHeight : 0;
      const offsetTop = el.getBoundingClientRect().top - scroller.getBoundingClientRect().top;
      const target = scroller.scrollTop + offsetTop - navH - 16;
      // Suppress scroll events fired by the smooth scroll so the manual-scroll
      // handler does not misread them as user input and pause follow.
      programmaticScrollUntil = performance.now() + 800;
      scroller.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    }
  };

  audio.addEventListener('timeupdate', update);
  audio.addEventListener('seeked', () => { resumeFollow(); update(); });

  cueEls.forEach((el, idx) => {
    el.addEventListener('dblclick', () => {
      const sec = cues[idx].startSec;
      if (!Number.isFinite(sec)) return;
      audio.currentTime = sec;
      audio.play().catch(() => {});
    });
  });
}

// --- Chapter index (irodori chapters.json) ---
// irodori_test が output.mp3 と同階層に吐く chapters.json (章の見出し + 時刻範囲) を
// 読み、目次パネルを描画する。再生位置で現在章をハイライトし、クリックでその章へ seek。
// SRT の同期スクロールと併存する「地図」(irodori_video の一覧カードの移植)。
const CHAPTER_SPEAKER_LABEL = { sota: 'ソウタ', rin: 'リン', kotoha: 'コトハ' };

function fmtClock(sec) {
  if (!Number.isFinite(sec)) return '--:--';
  const total = Math.floor(sec);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

async function loadSiblingChapters(audioPath) {
  const slash = audioPath.lastIndexOf('/');
  const dir = slash >= 0 ? audioPath.slice(0, slash + 1) : '';
  const data = await fetchJson(
    `/api/blob?repo=${encodeURIComponent(currentRepo)}&path=${encodeURIComponent(dir + 'chapters.json')}`
  );
  if (data && typeof data.content === 'string') {
    try {
      const arr = JSON.parse(data.content);
      return Array.isArray(arr) && arr.length ? arr : null;
    } catch { return null; }
  }
  return null;
}

async function setupChapterNav(audioPath) {
  // Capture refs before await (same rapid file-switch hazard as setupSrtEmbed).
  const panel = document.getElementById('chapter-nav');
  const audio = document.getElementById('audio-player');
  if (!panel || !audio) return;

  const chapters = await loadSiblingChapters(audioPath);
  if (!chapters) return;

  const rows = chapters.map((ch, i) => {
    // 話者バッジ(ソウタ/コトハ)は表示しないが、現在章の左ボーダー色には話者色を流用する。
    const label = CHAPTER_SPEAKER_LABEL[ch.speaker] || ch.speaker || '';
    const color = speakerColor(label);
    const styleAttr = color ? ` style="--speaker-color: ${color};"` : '';
    const no = String(ch.index != null ? ch.index : i + 1).padStart(2, '0');
    const sub = ch.sub ? `<span class="chapter-sub">${esc(ch.sub)}</span>` : '';
    return `<button type="button" class="chapter-item" data-idx="${i}" data-start="${ch.start}"${styleAttr}>
      <span class="chapter-no">${no}</span>
      <span class="chapter-time">${fmtClock(ch.start)}</span>
      <span class="chapter-body"><span class="chapter-headline">${esc(ch.headline || '')}</span>${sub}</span>
    </button>`;
  }).join('');
  panel.innerHTML = `<div class="chapter-nav-header chapter-nav-toggle">章 (${chapters.length})</div><div class="chapter-nav-list">${rows}</div><div class="chapter-nav-resize" title="ドラッグで高さ調整"></div>`;

  panel.querySelector('.chapter-nav-toggle')
    .addEventListener('click', () => panel.classList.toggle('collapsed'));

  // 章リストは内部スクロールを持ち、下端ハンドルをドラッグして高さ調整できる (PC/スマホ共通、
  // Pointer Events でマウス/タッチ両対応)。値は localStorage に保存して次回・別ファイルでも維持。
  const list = panel.querySelector('.chapter-nav-list');
  {
    const applyH = (h) => { list.classList.add('user-sized'); list.style.height = h + 'px'; };
    const savedH = parseInt(localStorage.getItem('chapterNavHeight') || '', 10);
    if (Number.isFinite(savedH) && savedH >= 56) applyH(savedH);

    const handle = panel.querySelector('.chapter-nav-resize');
    const maxH = () => Math.round(window.innerHeight * 0.85);
    let dragging = false, dragStartY = 0, dragStartH = 0;
    handle.addEventListener('pointerdown', (e) => {
      dragging = true;
      dragStartY = e.clientY;
      dragStartH = list.getBoundingClientRect().height;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      applyH(Math.max(56, Math.min(maxH(), Math.round(dragStartH + (e.clientY - dragStartY)))));
    });
    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false;
      try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
      const h = parseInt(list.style.height || '', 10);
      if (Number.isFinite(h)) localStorage.setItem('chapterNavHeight', String(h));
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  }

  const items = Array.from(panel.querySelectorAll('.chapter-item'));
  let curIdx = -1;

  // 章は連続 (各章 end ≒ 次章 start)。pause の隙間では「直前の章」を保つため、
  // start <= t を満たす最後の章を現在章とする。
  const chapterAt = (t) => {
    let idx = -1;
    for (let i = 0; i < chapters.length; i++) {
      if (t >= chapters[i].start) idx = i; else break;
    }
    return idx;
  };

  const update = () => {
    const idx = chapterAt(audio.currentTime);
    if (idx === curIdx) return;
    if (curIdx >= 0 && items[curIdx]) items[curIdx].classList.remove('current');
    curIdx = idx;
    if (idx < 0 || !items[idx]) return;
    items[idx].classList.add('current');
    // 内部スクロールするリスト内で現在章が見えるよう追従 (リスト内スクロールのみ)。
    if (!panel.classList.contains('collapsed')) {
      items[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  };

  audio.addEventListener('timeupdate', update);
  audio.addEventListener('seeked', update);

  // ダブルクリック/ダブルタップでその章へジャンプ (シングルでは誤爆しない)。
  // <button> 上では mobile の dblclick が発火しないため、click の2連を自前で検知する
  // (PC は2クリック、スマホは2タップ、どちらも click が飛ぶので両対応)。
  let lastIdx = -1, lastTime = 0;
  items.forEach((el, idx) => {
    el.addEventListener('click', () => {
      const now = Date.now();
      if (idx === lastIdx && now - lastTime < 400) {
        lastIdx = -1; lastTime = 0;
        const sec = parseFloat(el.dataset.start);
        if (!Number.isFinite(sec)) return;
        audio.currentTime = sec;
        audio.play().catch(() => {});
      } else {
        lastIdx = idx; lastTime = now;
      }
    });
  });

  update();
}

function splitHighlightedIntoLines(html) {
  const lines = [];
  let openTags = [];
  let currentLine = '';
  let i = 0;
  while (i < html.length) {
    const ch = html[i];
    if (ch === '<') {
      const end = html.indexOf('>', i);
      if (end < 0) { currentLine += html.slice(i); break; }
      const tag = html.slice(i, end + 1);
      currentLine += tag;
      if (tag.startsWith('</')) openTags.pop();
      else if (!tag.endsWith('/>')) openTags.push(tag);
      i = end + 1;
    } else if (ch === '\n') {
      currentLine += '</span>'.repeat(openTags.length);
      lines.push(currentLine);
      currentLine = openTags.join('');
      i++;
    } else {
      currentLine += ch;
      i++;
    }
  }
  lines.push(currentLine);
  return lines;
}

// ----- Markdown 文単位しおり -----

// 句点判定: 全角は常に文末。半角 . ! ? は後続が空白/末尾なら文末。
const MD_SENT_END = /[。！？]|[.!?](?=\s|$)/g;

// 文単位に分割しないコンテナ（中身を再帰)
const MD_CONTAINER_TAGS = new Set(['UL','OL','BLOCKQUOTE','TABLE','THEAD','TBODY','TR']);
// 1 単位のままで data-bm-idx を付ける（中身は再帰しない）
const MD_ATOMIC_TAGS = new Set(['H1','H2','H3','H4','H5','H6','PRE']);
// 文単位に分割する
const MD_SPLIT_TAGS = new Set(['P','LI','TH','TD']);

function isBlockChild(node) {
  if (node.nodeType !== 1) return false;
  const t = node.tagName;
  return MD_CONTAINER_TAGS.has(t) || MD_ATOMIC_TAGS.has(t) || MD_SPLIT_TAGS.has(t);
}

// テキストノード列内で文末位置を見つけ、文ごとに span でラップする。
function wrapInlineRunIntoSentences(parent, nodes, ctx) {
  const flushAfter = new Set();

  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (n.nodeType !== 3) continue;
    // text は分割前の元の nodeValue を保持し続ける。offsetBase が「どれだけ前に切り出したか」を追う
    let text = n.nodeValue;
    let offsetBase = 0;
    let cur = n;
    // splice の挿入位置を毎回進めて、nodes 配列の順序を DOM 順と一致させる
    let insertAt = i + 1;
    MD_SENT_END.lastIndex = 0;
    let m;
    while ((m = MD_SENT_END.exec(text)) !== null) {
      const cut = m.index + m[0].length - offsetBase;
      if (cut < cur.nodeValue.length) {
        const tail = cur.splitText(cut);
        flushAfter.add(cur);
        nodes.splice(insertAt, 0, tail);
        insertAt++;
        offsetBase = m.index + m[0].length;
        cur = tail;
      } else {
        flushAfter.add(cur);
      }
    }
  }

  const spans = [];
  let bucket = [];
  for (const n of nodes) {
    bucket.push(n);
    if (n.nodeType === 3 && flushAfter.has(n)) {
      spans.push(bucket);
      bucket = [];
    }
  }
  if (bucket.length > 0) spans.push(bucket);

  // 空白だけのグループは前にマージ
  const merged = [];
  for (const group of spans) {
    const onlyWs = group.every(n => n.nodeType === 3 && /^\s*$/.test(n.nodeValue));
    if (onlyWs && merged.length > 0) {
      merged[merged.length - 1].push(...group);
    } else {
      merged.push(group);
    }
  }

  const firstAnchor = nodes[0];
  if (!firstAnchor) return;
  for (const group of merged) {
    const span = document.createElement('span');
    span.className = 'bm-target';
    span.setAttribute('data-bm-idx', String(ctx.counter++));
    parent.insertBefore(span, group[0]);
    for (const n of group) span.appendChild(n);
  }
}

function markAtomic(el, ctx) {
  el.setAttribute('data-bm-idx', String(ctx.counter++));
  el.classList.add('bm-target');
}

function splitElementIntoSentences(parent, ctx) {
  const children = [...parent.childNodes];
  let inlineRun = [];
  for (const child of children) {
    if (isBlockChild(child)) {
      if (inlineRun.length > 0) {
        wrapInlineRunIntoSentences(parent, inlineRun, ctx);
        inlineRun = [];
      }
      processMdBlock(child, ctx);
    } else {
      inlineRun.push(child);
    }
  }
  if (inlineRun.length > 0) {
    wrapInlineRunIntoSentences(parent, inlineRun, ctx);
  }
}

function processMdBlock(node, ctx) {
  if (node.nodeType !== 1) return;
  const tag = node.tagName;
  if (MD_CONTAINER_TAGS.has(tag)) {
    for (const child of [...node.children]) processMdBlock(child, ctx);
    return;
  }
  if (MD_ATOMIC_TAGS.has(tag)) {
    markAtomic(node, ctx);
    return;
  }
  if (MD_SPLIT_TAGS.has(tag)) {
    splitElementIntoSentences(node, ctx);
    return;
  }
}

function splitMdIntoSentences(root) {
  const ctx = { counter: 0 };
  for (const child of [...root.children]) processMdBlock(child, ctx);
  return ctx.counter;
}

// ----- Mermaid diagram support -----

const MERMAID_THEME_MAP = { dark: 'dark', light: 'default', sepia: 'neutral' };

function mermaidThemeForUi(uiTheme) {
  return MERMAID_THEME_MAP[uiTheme] || 'default';
}

// `marked.parse` が `<pre><code class="language-mermaid">` を生成するので、
// それを `<div class="mermaid">` に置換する (sync)。元ソースは data 属性に保持して
// テーマ切替時に再描画できるようにする。
function prepareMermaidBlocks(container) {
  const codeBlocks = container.querySelectorAll('pre code.language-mermaid');
  const divs = [];
  codeBlocks.forEach(codeEl => {
    const pre = codeEl.closest('pre');
    if (!pre) return;
    const source = codeEl.textContent;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.dataset.mermaidSource = source;
    div.textContent = source;
    pre.replaceWith(div);
    divs.push(div);
  });
  return divs;
}

async function renderMermaidBlocks(divs, uiTheme) {
  if (typeof mermaid === 'undefined') return;
  if (!divs || divs.length === 0) return;
  try {
    mermaid.initialize({
      startOnLoad: false,
      theme: mermaidThemeForUi(uiTheme),
      securityLevel: 'loose',
      fontFamily: 'Yu Gothic UI, "Segoe UI", "Hiragino Sans", sans-serif',
      flowchart: { padding: 14, nodeSpacing: 35, rankSpacing: 50, htmlLabels: true, useMaxWidth: true },
      sequence: { actorMargin: 60, boxMargin: 10, noteMargin: 10, messageMargin: 35, wrap: true, noteAlign: 'left', useMaxWidth: true },
    });
    await mermaid.run({ nodes: divs });
  } catch (e) {
    console.error('Mermaid render error:', e);
  }
}

async function rerenderMermaidWithTheme(uiTheme) {
  if (typeof mermaid === 'undefined') return;
  const divs = document.querySelectorAll('.mermaid');
  if (divs.length === 0) return;
  divs.forEach(div => {
    const src = div.dataset.mermaidSource;
    if (!src) return;
    div.removeAttribute('data-processed');
    div.innerHTML = '';
    div.textContent = src;
  });
  await renderMermaidBlocks([...divs], uiTheme);
}

function bookmarkTarget(blobView, type, index) {
  if (type === 'md') {
    return blobView.querySelector(`[data-bm-idx="${index}"]`);
  }
  return blobView.querySelector(`.code-line[data-bm-line="${index}"]`);
}

function applyBookmarkUi(blobView, bm) {
  blobView.querySelectorAll('.bookmarked').forEach(el => el.classList.remove('bookmarked'));
  const jumpBtn = blobView.querySelector('#bm-jump-btn');
  if (!bm || !bm.type) {
    delete blobView.dataset.bmIdx;
    delete blobView.dataset.bmType;
    if (jumpBtn) jumpBtn.innerHTML = '';
    return;
  }
  blobView.dataset.bmIdx = String(bm.index);
  blobView.dataset.bmType = bm.type;
  const target = bookmarkTarget(blobView, bm.type, bm.index);
  if (target) {
    target.classList.add('bookmarked');
    if (bm.type === 'text') {
      const gutter = blobView.querySelector(`.code-line-num[data-bm-line="${bm.index}"]`);
      if (gutter) gutter.classList.add('bookmarked');
    }
    if (jumpBtn) {
      jumpBtn.innerHTML = `<button class="btn-jump" onclick="jumpToBookmark()">しおりへ</button>`;
    }
  } else if (jumpBtn) {
    jumpBtn.innerHTML = '';
  }
}

async function onBookmarkClick(path, type, index) {
  const blobView = document.getElementById('blob-view');
  if (!blobView) return;
  const sameType = blobView.dataset.bmType === type;
  const sameIdx = blobView.dataset.bmIdx === String(index);
  if (sameType && sameIdx) {
    await deleteBookmark(path);
    applyBookmarkUi(blobView, {});
  } else {
    await setBookmark(path, type, index);
    applyBookmarkUi(blobView, {type, index});
  }
}

function jumpToBookmark() {
  const blobView = document.getElementById('blob-view');
  if (!blobView) return;
  const idx = blobView.dataset.bmIdx;
  const type = blobView.dataset.bmType;
  if (idx === undefined || !type) return;
  const target = bookmarkTarget(blobView, type, Number(idx));
  if (target) target.scrollIntoView({block: 'center'});
}

// --- Blob preview state (FAB / nav zones / sibling tracking) ---
let currentBlobPath = '';
let currentBlobSiblings = [];
let currentBlobIdx = -1;
let lastDirFetch = { key: '', entries: null };
let navDirections = {}; // { "repo|dir|ext": "reversed" } — absent = normal

function navDirKey(path) {
  return `${currentRepo}|${getBlobDir(path)}|${getExt(path)}`;
}
function isNavReversed(path) {
  return navDirections[navDirKey(path)] === 'reversed';
}
async function toggleNavDirection() {
  if (!currentBlobPath) return;
  const key = navDirKey(currentBlobPath);
  const next = navDirections[key] === 'reversed' ? 'normal' : 'reversed';
  if (next === 'normal') delete navDirections[key];
  else navDirections[key] = next;
  renderBlobNavZones();
  renderNavDirToggle();
  try {
    await fetch('/api/nav_direction', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key, direction: next}),
    });
  } catch (e) { console.error('nav_direction save failed', e); }
}

function getBlobDir(p) {
  const i = p.lastIndexOf('/');
  return i >= 0 ? p.substring(0, i) : '';
}
function getExt(p) {
  const slash = p.lastIndexOf('/');
  const dot = p.lastIndexOf('.');
  return dot > slash ? p.substring(dot + 1).toLowerCase() : '';
}
function isEditableExt(ext) {
  return TEXT_EXTS.includes(ext);
}

function isHtmlExt(ext) {
  return ext === 'html' || ext === 'htm';
}

// Build a /raw/ URL that mirrors the repo's on-disk layout so the rendered
// page's relative CSS/JS/image references resolve against sibling /raw/ URLs.
function rawUrl(path) {
  const segs = (currentRepo + '/' + path).split('/').filter(Boolean).map(encodeURIComponent);
  return '/raw/' + segs.join('/');
}

// Per-session toggle: HTML files render in an iframe by default; this flips to
// source view. Persists across files (a viewing preference, like autoplay).
let htmlSourceMode = false;
function toggleHtmlSource() {
  htmlSourceMode = !htmlSourceMode;
  if (currentBlobPath) showBlob(currentBlobPath);
}

// Extra header controls shown when an HTML file is displayed as source.
function htmlSourceHeaderExtras(path, ext) {
  if (!isHtmlExt(ext)) return '';
  const rUrl = rawUrl(path);
  return `<a href="${rUrl}" target="_blank" rel="noopener" style="margin-left:8px;color:var(--accent);font-size:11px;">新しいタブで開く</a>` +
    `<button onclick="toggleHtmlSource()" style="margin-left:8px;font-size:11px;padding:1px 6px;">レンダリング表示</button>`;
}

async function loadSiblings(path) {
  const dir = getBlobDir(path);
  const ext = getExt(path);
  const key = `${currentRepo}|${dir}`;
  let entries = (lastDirFetch.key === key) ? lastDirFetch.entries : null;
  if (!entries) {
    entries = await fetchJson(`/api/tree?repo=${currentRepo}&path=${encodeURIComponent(dir)}`);
    if (Array.isArray(entries)) lastDirFetch = { key, entries };
  }
  if (!Array.isArray(entries)) return { siblings: [], idx: -1 };
  const sorted = sortEntries(entries, getSortConfig(currentRepo, dir));
  const siblings = sorted
    .filter(e => e.type === 'blob' && getExt(e.path) === ext)
    .map(e => e.path);
  return { siblings, idx: siblings.indexOf(path) };
}

function highlightCurrentInList() {
  document.querySelectorAll('.list-row.active').forEach(el => el.classList.remove('active'));
  if (!currentBlobPath) return;
  const sel = (window.CSS && CSS.escape) ? CSS.escape(currentBlobPath) : currentBlobPath.replace(/"/g, '\\"');
  const row = document.querySelector(`.list-row[data-blob-path="${sel}"]`);
  if (row) row.classList.add('active');
}

function renderEditFab(path) {
  const old = document.getElementById('edit-fab');
  if (old) old.remove();
  const btn = document.createElement('button');
  btn.id = 'edit-fab';
  btn.className = 'btn-edit-fab';
  btn.textContent = '編集';
  btn.onclick = () => editBlob(path);
  document.body.appendChild(btn);
}
function clearEditFab() {
  const old = document.getElementById('edit-fab');
  if (old) old.remove();
}

function clearBlobNavZones() {
  document.querySelectorAll('.blob-nav-zone').forEach(el => el.remove());
}
function renderBlobNavZones() {
  clearBlobNavZones();
  if (currentBlobSiblings.length <= 1 || currentBlobIdx < 0) return;
  const prev = currentBlobIdx > 0 ? currentBlobSiblings[currentBlobIdx - 1] : null;
  const next = currentBlobIdx < currentBlobSiblings.length - 1 ? currentBlobSiblings[currentBlobIdx + 1] : null;
  // reversed: swap which side is prev vs next (e.g. vertical-text book = next on left)
  const reversed = isNavReversed(currentBlobPath);
  const leftPath = reversed ? next : prev;
  const rightPath = reversed ? prev : next;
  if (leftPath) {
    const el = document.createElement('div');
    el.className = 'blob-nav-zone left';
    el.innerHTML = '<span>‹</span>';
    el.title = leftPath.split('/').pop();
    el.onclick = () => showBlob(leftPath);
    document.body.appendChild(el);
  }
  if (rightPath) {
    const el = document.createElement('div');
    el.className = 'blob-nav-zone right';
    el.innerHTML = '<span>›</span>';
    el.title = rightPath.split('/').pop();
    el.onclick = () => showBlob(rightPath);
    document.body.appendChild(el);
  }
}

function clearNavDirToggle() {
  const slot = document.getElementById('nav-dir-toggle-slot');
  if (slot) slot.innerHTML = '';
}
function renderNavDirToggle() {
  const slot = document.getElementById('nav-dir-toggle-slot');
  if (!slot) return;
  if (currentBlobSiblings.length <= 1 || currentBlobIdx < 0) {
    slot.innerHTML = '';
    return;
  }
  const reversed = isNavReversed(currentBlobPath);
  slot.innerHTML = `<button id="nav-dir-toggle" class="btn-nav-dir-toggle" title="このフォルダ・拡張子のナビ方向を反転">${reversed ? '次 ←' : '→ 次'}</button>`;
  const btn = document.getElementById('nav-dir-toggle');
  if (btn) btn.onclick = toggleNavDirection;
}

function clearBlobUi() {
  currentBlobPath = '';
  currentBlobSiblings = [];
  currentBlobIdx = -1;
  clearEditFab();
  clearBlobNavZones();
  clearNavDirToggle();
}

// Preload an image so the new <img> is decoded before we swap the DOM.
// The browser caches the response, so the subsequent <img src=...> renders
// instantly from cache — no flicker while the previous image is removed.
function preloadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = resolve;
    img.onerror = resolve;
    img.src = url;
  });
}

async function showBlob(path) {
  const blobView = document.getElementById('blob-view');
  if (!blobView) return;

  // Preserve current blob-view height during the swap so the document does not
  // shrink and yank the scroll position to the top. Old content stays visible
  // until the new render replaces it (no jarring "Loading..." flash mid-swap).
  const prevHeight = blobView.offsetHeight;
  if (prevHeight > 0) {
    blobView.style.minHeight = prevHeight + 'px';
  } else {
    blobView.innerHTML = '<div style="padding:4px 8px;color:var(--text-muted);">Loading...</div>';
  }
  // Release the placeholder height once the new content has had time to settle
  // (incl. <img> decode). Stale-guard so a rapid switch keeps the new height.
  setTimeout(() => {
    if (currentBlobPath === path) blobView.style.minHeight = '';
  }, 1500);

  const ext = path.includes('.') ? path.split('.').pop().toLowerCase() : '';
  const blobUrl = `/api/blob?repo=${currentRepo}&path=${encodeURIComponent(path)}`;
  const fileName = path.split('/').pop();

  // Common preview UI: edit FAB, list highlight, sibling navigation zones
  currentBlobPath = path;
  if (isEditableExt(ext)) renderEditFab(path);
  else clearEditFab();
  highlightCurrentInList();
  clearBlobNavZones();
  clearNavDirToggle();
  loadSiblings(path).then(({ siblings, idx }) => {
    if (currentBlobPath !== path) return; // stale
    currentBlobSiblings = siblings;
    currentBlobIdx = idx;
    renderBlobNavZones();
    renderNavDirToggle();
  });

  // Binary files — show download link only
  if (!IMAGE_EXTS.includes(ext) && !PDF_EXTS.includes(ext) && !AUDIO_EXTS.includes(ext) && !VIDEO_EXTS.includes(ext) && !TEXT_EXTS.includes(ext) && ext !== '') {
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span></div>
      <div class="diff-empty">バイナリファイル — <a href="${blobUrl}" download style="color:var(--accent);">ダウンロード</a></div>`;
    return;
  }

  // Images: preload first so the prior image stays visible until the new one
  // is decoded. Stale-guard: if user clicked past this one while preloading,
  // skip the render.
  if (IMAGE_EXTS.includes(ext)) {
    await preloadImage(blobUrl);
    if (currentBlobPath !== path) return;
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span></div>
      <div class="blob-container" style="text-align:center;padding:8px;">
        <img src="${blobUrl}" alt="${esc(fileName)}" style="max-width:100%;height:auto;">
      </div>`;
    renderNavDirToggle();
    return;
  }

  // Video
  if (VIDEO_EXTS.includes(ext)) {
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span>${autoplayToggleHtml()}</div>
      <div class="blob-container" style="padding:8px; overflow: visible;">
        <video id="audio-player" controls preload="metadata" src="${blobUrl}"${autoplayMedia?' autoplay':''} style="width:100%; max-height:70vh; background:#000;"></video>
        <div id="playback-log-list" class="playback-log"></div>
        <div id="chapter-nav" class="chapter-nav"></div>
        <div id="srt-embed" class="srt-embed-container"></div>
      </div>`;
    wireAutoplayToggle();
    setupPlaybackLog(path);
    setupChapterNav(path);
    setupSrtEmbed(path);
    return;
  }

  // Audio
  if (AUDIO_EXTS.includes(ext)) {
    const audioAutoplay = autoplayMedia || audioContinuous;
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span>${autoplayToggleHtml()}${continuousToggleHtml()}</div>
      <div class="blob-container" style="padding:8px; overflow: visible;">
        <div class="audio-float"><audio id="audio-player" controls preload="metadata" src="${blobUrl}"${audioAutoplay?' autoplay':''}></audio></div>
        <div id="playback-log-list" class="playback-log"></div>
        <div id="chapter-nav" class="chapter-nav"></div>
        <div id="srt-embed" class="srt-embed-container"></div>
      </div>`;
    wireAutoplayToggle();
    wireContinuousToggle();
    setupAudioContinuous();
    setupPlaybackLog(path);
    setupChapterNav(path);
    setupSrtEmbed(path);
    return;
  }

  // PDF
  if (PDF_EXTS.includes(ext)) {
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span>
        <a href="${blobUrl}" target="_blank" rel="noopener" style="margin-left:8px;color:var(--accent);font-size:11px;">新しいタブで開く</a>
      </div>
      <iframe src="${blobUrl}" style="width:100%;height:70vh;border:1px solid #21262d;border-radius:4px;"></iframe>`;
    return;
  }

  // HTML — render as a webpage in an iframe. The /raw/ URL mirrors the repo's
  // directory layout, so relative CSS/JS/images resolve. "新しいタブで開く"
  // gives a clean full-screen view (handy on mobile). Toggle to view source.
  if (isHtmlExt(ext) && !htmlSourceMode) {
    const rUrl = rawUrl(path);
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span>
        <a href="${rUrl}" target="_blank" rel="noopener" style="margin-left:8px;color:var(--accent);font-size:11px;">新しいタブで開く</a>
        <button onclick="toggleHtmlSource()" style="margin-left:8px;font-size:11px;padding:1px 6px;">ソースを表示</button>
      </div>
      <iframe src="${rUrl}" style="width:100%;height:80vh;border:1px solid #21262d;border-radius:4px;background:#fff;"></iframe>`;
    renderNavDirToggle();
    return;
  }

  // Text / Code / Markdown
  const data = await fetchJson(blobUrl);
  if (data.content === undefined) {
    blobView.innerHTML = '<div class="diff-empty">ファイルを表示できません</div>';
    return;
  }

  const fileExt = data.ext || '';
  if (fileExt === '.md') {
    const mdPrefs = JSON.parse(localStorage.getItem('mdPrefs') || '{}');
    const fontSize = mdPrefs.fontSize || '13';
    const spacing = mdPrefs.spacing || '6';
    const theme = mdPrefs.theme || 'dark';
    const themeClass = theme === 'dark' ? '' : ` md-theme-${theme}`;
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span><span id="bm-jump-btn"></span></div>
      <div class="md-toolbar">
        <label>文字サイズ<select id="md-font-size" onchange="updateMdPref('fontSize',this.value)">
          <option value="11"${fontSize==='11'?' selected':''}>小</option>
          <option value="13"${fontSize==='13'?' selected':''}>中</option>
          <option value="15"${fontSize==='15'?' selected':''}>大</option>
          <option value="18"${fontSize==='18'?' selected':''}>特大</option>
        </select></label>
        <label>段落間隔<select id="md-spacing" onchange="updateMdPref('spacing',this.value)">
          <option value="4"${spacing==='4'?' selected':''}>狭い</option>
          <option value="6"${spacing==='6'?' selected':''}>普通</option>
          <option value="10"${spacing==='10'?' selected':''}>広い</option>
          <option value="16"${spacing==='16'?' selected':''}>とても広い</option>
        </select></label>
        <label>テーマ<select id="md-theme" onchange="updateMdPref('theme',this.value)">
          <option value="dark"${theme==='dark'?' selected':''}>ダーク</option>
          <option value="light"${theme==='light'?' selected':''}>ライト</option>
          <option value="sepia"${theme==='sepia'?' selected':''}>セピア</option>
        </select></label>
      </div>
      <div class="blob-container markdown-body${themeClass}" id="md-body" style="padding:12px;--md-font-size:${fontSize}px;--md-spacing:${spacing}px;"></div>`;
    const mdBody = blobView.querySelector('#md-body');
    mdBody.innerHTML = marked.parse(data.content, { breaks: true });
    rewriteMdAssets(mdBody, parentPath(path));
    // Mermaid: <pre><code class="language-mermaid"> を <div class="mermaid"> に変換 (sync)
    // hljs / splitMdIntoSentences が触る前にやる
    const mermaidDivs = prepareMermaidBlocks(mdBody);
    blobView.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
    // 文単位 / 見出し単位 / コードブロック単位で data-bm-idx を付与
    splitMdIntoSentences(mdBody);
    // Mermaid を非同期描画 (fire-and-forget、ブックマーク等の処理を待たせない)
    renderMermaidBlocks(mermaidDivs, theme);
    mdBody.querySelectorAll('[data-bm-idx]').forEach(el => {
      const idx = Number(el.getAttribute('data-bm-idx'));
      el.addEventListener('dblclick', (e) => {
        if (e.target.closest('a, button, input, select, textarea, img')) return;
        onBookmarkClick(path, 'md', idx);
      });
    });
    const bm = await fetchBookmark(path);
    applyBookmarkUi(blobView, bm);
    if (path.endsWith('.notes.md')) {
      // Viewing a *.notes.md directly. Fetch via the target path so we get
      // parsed sections + resolution. Skip the regular markdown note
      // decoration (which would add nonsensical "+" markers to every heading
      // and target the wrong bm-idx numbering) and the unresolved panel.
      const target = path.slice(0, -'.notes.md'.length);
      await fetchNotes(target);
      notesState.viewPath = path;
      decorateNotesMdView(mdBody);
    } else {
      await fetchNotes(path);
      decorateMdNotes(mdBody);
      renderUnresolvedPanel(blobView);
    }
  } else if (fileExt === '.srt') {
    const cues = parseSrt(data.content);
    if (cues.length === 0) {
      blobView.innerHTML = `
        <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span></div>
        <div class="diff-empty">字幕を読み込めませんでした</div>
        <pre class="blob-container" style="padding:8px;white-space:pre-wrap;">${esc(data.content)}</pre>`;
      renderNavDirToggle();
      return;
    }
    const cardsHtml = cues.map((c, i) => {
      const color = speakerColor(c.speaker);
      const styleAttr = color ? ` style="--speaker-color: ${color};"` : '';
      const timeStr = (c.start && c.end) ? `${c.start} → ${c.end}` : '--';
      const idxStr = c.index || '';
      return `
        <div class="srt-cue bm-target" data-bm-idx="${i}"${styleAttr}>
          <div class="srt-meta">
            <span class="srt-index">${esc(idxStr)}</span>
            <span class="srt-time">${esc(timeStr)}</span>
          </div>
          <div class="srt-text">${esc(c.text)}</div>
        </div>`;
    }).join('');
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span><span id="bm-jump-btn"></span></div>
      <div class="blob-container srt-container">${cardsHtml}</div>`;
    blobView.querySelectorAll('.srt-cue').forEach((el, idx) => {
      el.addEventListener('dblclick', (e) => {
        if (e.target.closest('a, button, input, select, textarea, img')) return;
        onBookmarkClick(path, 'md', idx);
      });
    });
    const bm = await fetchBookmark(path);
    applyBookmarkUi(blobView, bm);
    await fetchNotes(path);
    decorateSrtNotes(blobView, cues);
    renderUnresolvedPanel(blobView);
  } else {
    const lang = LANG_MAP[fileExt] || 'plaintext';
    let highlighted;
    try {
      highlighted = hljs.highlight(data.content, {language: lang, ignoreIllegals: true}).value;
    } catch {
      highlighted = data.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    const lines = splitHighlightedIntoLines(highlighted);
    const rowsHtml = lines.map((line, i) =>
      `<div class="code-line-num" data-bm-line="${i+1}">${i+1}</div>` +
      `<div class="code-line" data-bm-line="${i+1}">${line || ' '}</div>`
    ).join('');
    blobView.innerHTML = `
      <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span><span id="bm-jump-btn"></span>${htmlSourceHeaderExtras(path, ext)}</div>
      <div class="blob-container">
        <div class="code-wrapper hljs language-${lang}">${rowsHtml}</div>
      </div>`;
    blobView.querySelectorAll('.code-line-num, .code-line').forEach(el => {
      el.addEventListener('dblclick', () => {
        const line = Number(el.getAttribute('data-bm-line'));
        onBookmarkClick(path, 'text', line);
      });
    });
    const bm = await fetchBookmark(path);
    applyBookmarkUi(blobView, bm);
    await fetchNotes(path);
    decorateTextNotes(blobView, path);
    renderUnresolvedPanel(blobView);
  }
  // Re-render the nav-direction toggle now that the slot exists in the new
  // innerHTML. For async branches (text/MD/SRT/code) the loadSiblings .then
  // can resolve before the await fetchJson does, so the .then's render call
  // hits a missing slot — this catches that race.
  renderNavDirToggle();
}

function updateMdPref(key, value) {
  const prefs = JSON.parse(localStorage.getItem('mdPrefs') || '{}');
  prefs[key] = value;
  localStorage.setItem('mdPrefs', JSON.stringify(prefs));
  const body = document.getElementById('md-body');
  if (!body) return;
  if (key === 'fontSize') body.style.setProperty('--md-font-size', value + 'px');
  if (key === 'spacing') body.style.setProperty('--md-spacing', value + 'px');
  if (key === 'theme') {
    body.classList.remove('md-theme-light', 'md-theme-sepia');
    if (value !== 'dark') body.classList.add('md-theme-' + value);
    rerenderMermaidWithTheme(value);
  }
}

// Media autoplay (audio/video). User-toggleable; persisted in localStorage.
// Applies on every new media load — the toggle change does NOT restart the
// currently playing file.
let autoplayMedia = localStorage.getItem('autoplayMedia') === 'true';
// Audio-only "continuous" mode: when the current audio ends, navigate to the
// next sibling. Implies autoplay (the next track must actually start).
let audioContinuous = localStorage.getItem('audioContinuous') === 'true';

function autoplayToggleHtml() {
  return `<label class="autoplay-toggle" title="次のファイルから自動再生" style="margin-left:8px;font-size:11px;cursor:pointer;color:var(--text-muted);user-select:none;">
    <input type="checkbox" id="autoplay-cb"${autoplayMedia?' checked':''} style="vertical-align:middle;margin:0 3px 0 0;"> 自動再生
  </label>`;
}
function continuousToggleHtml() {
  return `<label class="autoplay-toggle" title="再生終了で次のファイルへ自動移動（自動再生も有効化）" style="margin-left:8px;font-size:11px;cursor:pointer;color:var(--text-muted);user-select:none;">
    <input type="checkbox" id="continuous-cb"${audioContinuous?' checked':''} style="vertical-align:middle;margin:0 3px 0 0;"> 連続再生
  </label>`;
}
function wireAutoplayToggle() {
  const cb = document.getElementById('autoplay-cb');
  if (!cb) return;
  cb.addEventListener('change', () => {
    autoplayMedia = cb.checked;
    localStorage.setItem('autoplayMedia', String(autoplayMedia));
  });
}
function wireContinuousToggle() {
  const cb = document.getElementById('continuous-cb');
  if (!cb) return;
  cb.addEventListener('change', () => {
    audioContinuous = cb.checked;
    localStorage.setItem('audioContinuous', String(audioContinuous));
  });
}
function setupAudioContinuous() {
  const audio = document.getElementById('audio-player');
  if (!audio) return;
  audio.addEventListener('ended', () => {
    if (!audioContinuous) return;
    if (currentBlobIdx < 0 || currentBlobIdx >= currentBlobSiblings.length - 1) return;
    const next = currentBlobSiblings[currentBlobIdx + 1];
    showBlob(next);
  });
}

let editingPath = '';
let editingOriginal = '';

async function editBlob(path) {
  const blobView = document.getElementById('blob-view');
  if (!blobView) return;

  clearEditFab();
  clearBlobNavZones();
  clearNavDirToggle();
  editingPath = path;
  const blobUrl = `/api/blob?repo=${currentRepo}&path=${encodeURIComponent(path)}`;
  const data = await fetchJson(blobUrl);
  if (data.content === undefined) {
    blobView.innerHTML = '<div class="diff-empty">ファイルを編集できません</div>';
    return;
  }

  editingOriginal = data.content;
  const escaped = data.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  blobView.innerHTML = `
    <div class="section-header" style="margin-top:8px;">${esc(path)}${copyPathBtn(path)}<span id="nav-dir-toggle-slot"></span>
      <span style="margin-left:8px;color:var(--text-muted);font-size:11px;">編集中</span>
    </div>
    <div class="blob-container">
      <textarea id="edit-textarea" class="edit-textarea" spellcheck="false">${escaped}</textarea>
      <div class="edit-controls">
        <button class="btn-cancel" onclick="showBlob('${esc(editingPath)}')">キャンセル</button>
        <button class="btn-save" onclick="saveBlob()">保存</button>
      </div>
    </div>`;

  const ta = document.getElementById('edit-textarea');
  ta.style.height = Math.max(200, ta.scrollHeight) + 'px';
